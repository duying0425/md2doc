name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release against (defaults to pyproject.toml version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[build]

      - name: Build Executable
        shell: pwsh
        run: |
          ./scripts/build_exe.ps1

      - name: Determine Tag
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $ver = (Get-Content pyproject.toml | Select-String 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
            $tag = "v$ver"
          }
          Write-Host "Releasing to tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: bin/md2doc.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
